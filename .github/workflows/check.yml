name: Check Carousell

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write             # lets the bot save seen_listings.json

concurrency: carousell-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: python -m playwright install --with-deps chromium
      - run: python seiko_cloud_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save seen listings
        run: |
          git config user.name "seiko-bot"
          git config user.email "seiko-bot@users.noreply.github.com"
          git add seen_listings.json || true
          git diff --cached --quiet || git commit -m "update seen listings"
          git push
